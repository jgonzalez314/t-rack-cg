name: Delete merged branch

# Deletes a pull request's head branch once the PR is merged.
# Only branches in this repository are touched (not forks), and the
# default branch is never deleted.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "Deleted branch ${BRANCH}"
          else
            # Already gone (e.g. deleted by hand or by the repo setting).
            echo "Branch ${BRANCH} was not deleted (it may already be gone)"
          fi
