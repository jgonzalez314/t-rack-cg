name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, format, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # No Supabase keys are set here, so the app builds in local mode.
      - name: Build
        run: npm run build

      # The static GitHub Pages preview (see pages.yml) must keep building too.
      - name: Build GitHub Pages preview
        run: npm run build:pages
        env:
          BASE_PATH: /t-rack-cg
